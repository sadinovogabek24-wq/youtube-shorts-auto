name: YouTube Shorts Serial

on:
  workflow_dispatch:
    inputs:
      part:
        description: "Qism: 1 yoki 2"
        required: true
        default: "1"
  schedule:
    - cron: "0 5 * * *"
    - cron: "0 17 * * *"

permissions:
  contents: write

concurrency:
  group: daily-mystery-serial
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repositoryni yuklash
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: FFmpeg o'rnatish
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Kutubxonalarni o'rnatish
        run: pip install -r requirements.txt

      - name: Qismni aniqlash
        id: part
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PART="${{ inputs.part }}"
          elif [ "${{ github.event.schedule }}" = "0 5 * * *" ]; then
            PART="1"
          else
            PART="2"
          fi
          echo "part=$PART" >> "$GITHUB_OUTPUT"

      - name: Video yaratish va yuklash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          EPISODE_PART: ${{ steps.part.outputs.part }}
        run: python main.py

      - name: Hikoyani saqlash
        if: steps.part.outputs.part == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add episode.json
          git commit -m "Save today's two-part story" || true
          git push
