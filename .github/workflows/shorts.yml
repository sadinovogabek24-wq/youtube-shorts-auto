name: YouTube Shorts Automation

on:
  schedule:
    # 1-qism: Toshkent vaqti 22:00
    - cron: '0 17 * * *'
    # 2-qism: Toshkent vaqti 10:00
    - cron: '0 5 * * *'

  workflow_dispatch:
    inputs:
      video_part:
        description: 'Qaysi qism?'
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '2'

permissions:
  contents: write

concurrency:
  group: youtube-shorts-automation
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repositoryni yuklash
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kutubxonalarni o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install moviepy==1.0.3 Pillow==9.5.0 requests edge-tts google-genai google-auth google-api-python-client imageio-ffmpeg

      - name: Video qismini aniqlash
        id: part
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            PART="${{ inputs.video_part }}"
          elif [[ "${{ github.event.schedule }}" == "0 17 * * *" ]]; then
            PART="1"
          else
            PART="2"
          fi
          echo "video_part=$PART" >> "$GITHUB_OUTPUT"

      - name: Shorts yaratish va yuklash
        env:
          VIDEO_PART: ${{ steps.part.outputs.video_part }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: python main.py

      - name: episode.json saqlash
        if: always() && steps.part.outputs.video_part == '1'
        run: |
          if [ -f episode.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add episode.json
            git commit -m "Save story for next Shorts episode" || echo "O'zgarish yo'q"
            git push
          else
            echo "episode.json topilmadi"
          fi
